<!DOCTYPE html><html lang="hi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>HackerBook</title>
    <link rel="stylesheet" href="./style.css">
</head><body><!-- LOGIN / REGISTER --><div id="authSection"><div class="card auth-card">

    <h1 class="brand-logo">HackerBook</h1>
    <p class="brand-sub">Connect & Share with friends</p>

    <div id="authError" class="error hidden"></div>

    <input
        type="email"
        id="authEmail"
        placeholder="Email"
    >

    <input
        type="password"
        id="authPassword"
        placeholder="Password"
    >

    <button
        id="loginBtn"
        type="button"
        class="btn btn-primary">
        Log In
    </button>

    <hr>

    <button
        id="registerBtn"
        type="button"
        class="btn btn-secondary">
        Create New Account
    </button>

</div>

</div><!-- MAIN APP --><div id="appSection" class="hidden"><header class="header">

    <h1>HackerBook</h1>

    <nav>

        <button id="navFeed" type="button">
            🏠 Feed
        </button>

        <button id="navUsers" type="button">
            👥 Users
        </button>

        <button id="navChat" type="button">
            💬 Chat
        </button>

        <button id="logoutBtn" type="button">
            Logout
        </button>

    </nav>

</header>


<main class="container">

    <!-- FEED -->
    <section id="feedView">

        <div class="card">

            <h2>Create Post</h2>

            <textarea
                id="postInput"
                placeholder="What's on your mind?">
            </textarea>

            <div class="media-upload-options">

                <label class="media-btn">

                    📷 Photo / Video

                    <input
                        type="file"
                        id="mediaInput"
                        accept="image/*,video/*"
                        hidden
                    >

                </label>

                <span
                    id="fileNameDisplay"
                    class="file-name">
                </span>

            </div>

            <button
                id="postBtn"
                type="button"
                class="btn btn-primary">
                Post
            </button>

        </div>

        <div id="postsContainer"></div>

    </section>


    <!-- USERS -->
    <section
        id="usersView"
        class="hidden">

        <div class="card">

            <h2 class="section-title">
                👥 Users
            </h2>

            <p class="sub-text">
                Find people and follow them.
            </p>

            <div id="allUsersContainer"></div>

        </div>

    </section>


    <!-- CHAT -->
    <section
        id="chatView"
        class="hidden">

        <div
            id="userListCard"
            class="card">

            <h2 class="section-title">
                💬 Messages
            </h2>

            <p class="sub-text">
                Chat with your friends.
            </p>

            <div id="friendsContainer"></div>

        </div>


        <div
            id="activeChatCard"
            class="card hidden">

            <div class="chat-header">

                <h3 id="chatWithTitle">
                    Chat
                </h3>

                <button
                    id="backChatBtn"
                    type="button">
                    ← Back
                </button>

            </div>

            <div
                id="chatBox"
                class="chat-box">
            </div>

            <div class="chat-input">

                <input
                    type="text"
                    id="chatInput"
                    placeholder="Type a message..."
                >

                <button
                    id="sendBtn"
                    type="button"
                    class="btn btn-primary">
                    Send
                </button>

            </div>

        </div>

    </section>

</main>

</div><!-- IMPORTANT --><script
    type="module"
    src="./input.js">
</script></body>
</html>
