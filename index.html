<!DOCTYPE html><html lang="hi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0"><title>HackerBook - Social, Reels & Chat</title>

<link rel="stylesheet" href="style.css">

</head><body><!-- ================= AUTH SECTION ================= -->

<div id="authSection">

    <div class="card auth-card">

        <h1 class="brand-logo">
            HackerBook
        </h1>

        <p class="brand-sub">
            Connect & Share with friends
        </p>

        <div id="authError"
             class="error hidden">
        </div>

        <input
            type="email"
            id="authEmail"
            placeholder="Email"
            autocomplete="email"
        >

        <input
            type="password"
            id="authPassword"
            placeholder="Password"
            autocomplete="current-password"
        >

        <button
            id="loginBtn"
            class="btn btn-primary"
            type="button">
            Log In
        </button>

        <hr>

        <button
            id="registerBtn"
            class="btn btn-secondary"
            type="button">
            Create New Account
        </button>

    </div>

</div>


<!-- ================= MAIN APP ================= -->

<div id="appSection" class="hidden">

    <!-- HEADER -->

    <header class="header">

        <h1>
            HackerBook
        </h1>

        <nav>

            <button
                id="navFeed"
                type="button">
                🏠 Feed
            </button>

            <button
                id="navUsers"
                type="button">
                👥 Users
            </button>

            <button
                id="navChat"
                type="button">
                💬 Chat
            </button>

            <button
                id="logoutBtn"
                type="button">
                Logout
            </button>

        </nav>

    </header>


    <!-- MAIN CONTAINER -->

    <main class="container">


        <!-- ================= FEED ================= -->

        <section id="feedView">

            <!-- CREATE POST -->

            <div class="card">

                <h2>
                    Create Post
                </h2>

                <textarea
                    id="postInput"
                    placeholder="What's on your mind?"
                ></textarea>


                <div class="media-upload-options">

                    <label class="media-btn">

                        📷 Photo / Video

                        <input
                            type="file"
                            id="mediaInput"
                            accept="image/*,video/*"
                            hidden
                        >

                    </label>

                    <span
                        id="fileNameDisplay"
                        class="file-name">
                    </span>

                </div>


                <button
                    id="postBtn"
                    class="btn btn-primary"
                    type="button">
                    Post
                </button>

            </div>


            <!-- POSTS -->

            <div id="postsContainer">
            </div>

        </section>


        <!-- ================= USERS ================= -->

        <section
            id="usersView"
            class="hidden">

            <div class="card">

                <h2 class="section-title">
                    👥 Users
                </h2>

                <p class="sub-text">
                    Find people and follow them.
                </p>

                <div id="allUsersContainer">
                </div>

            </div>

        </section>


        <!-- ================= CHAT ================= -->

        <section
            id="chatView"
            class="hidden">


            <!-- FRIEND LIST -->

            <div
                id="userListCard"
                class="card">

                <h2 class="section-title">
                    💬 Messages
                </h2>

                <p class="sub-text">
                    Chat with your followers or people you follow.
                </p>

                <div id="friendsContainer">
                </div>

            </div>


            <!-- ACTIVE CHAT -->

            <div
                id="activeChatCard"
                class="card hidden">


                <div class="chat-header">

                    <h3 id="chatWithTitle">
                        Chat
                    </h3>

                    <button
                        id="backChatBtn"
                        type="button">
                        ← Back
                    </button>

                </div>


                <div
                    id="chatBox"
                    class="chat-box">
                </div>


                <div class="chat-input">

                    <input
                        type="text"
                        id="chatInput"
                        placeholder="Type a message..."
                        autocomplete="off"
                    >

                    <button
                        id="sendBtn"
                        class="btn btn-primary"
                        type="button">
                        Send
                    </button>

                </div>

            </div>

        </section>

    </main>

</div>


<!-- ================= FIREBASE ================= -->

<script type="module">

    import { initializeApp }
    from "https://www.gstatic.com/firebasejs/12.1.0/firebase-app.js";

    import {
        getAuth
    }
    from "https://www.gstatic.com/firebasejs/12.1.0/firebase-auth.js";

    import {
        getDatabase
    }
    from "https://www.gstatic.com/firebasejs/12.1.0/firebase-database.js";


    const firebaseConfig = {

        apiKey:
            "AIzaSyBoU-pijNz9S-9v2OyLxArGYkZVtuc95fA",

        authDomain:
            "hacker-book.firebaseapp.com",

        databaseURL:
            "https://hacker-book-default-rtdb.firebaseio.com",

        projectId:
            "hacker-book",

        storageBucket:
            "hacker-book.firebasestorage.app",

        messagingSenderId:
            "341319299799",

        appId:
            "1:341319299799:web:77e386f68b153cc4e3f692",

        measurementId:
            "G-BL9YZRFJEM"
    };


    const app =
        initializeApp(firebaseConfig);


    const auth =
        getAuth(app);


    const database =
        getDatabase(app);


    /*
     * input.js को Firebase objects
     * उपलब्ध कराने के लिए window पर रख रहे हैं।
     */

    window.firebaseApp = app;

    window.firebaseAuth = auth;

    window.firebaseDB = database;


    /*
     * अब external input.js load होगा।
     */

    const script =
        document.createElement("script");

    script.src = "input.js";

    script.type = "module";

    document.body.appendChild(script);

</script>

</body>
</html>
